# Local Airflow for FinSentry (DEPLOY TARGET). The one-command local repro uses the
# plain Python runner (python -m finsentry.pipeline_runner) and needs none of this.
#
# This is a trimmed, single-node LocalExecutor setup based on the official
# apache/airflow 2.9.3 compose. It mounts the repo at /opt/finsentry so the DAG can
# run generate_data -> load_raw -> dbt run -> dbt test against the repo in place.
#
# Bring up:   cd airflow && docker compose up airflow-init && docker compose up
# UI:         http://localhost:8080  (user: airflow / pass: airflow)
# Trigger:    enable & trigger the `finsentry_pipeline` DAG.
---
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Install dbt-duckdb + core deps into the scheduler/worker at container start.
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.8.7 dbt-duckdb==1.8.4 duckdb==1.1.3 pandas==2.2.3 numpy==1.26.4 pyyaml==6.0.2"
    # Make the repo importable (finsentry package) and point the DAG at it.
    PYTHONPATH: /opt/finsentry/src
    FINSENTRY_PROJECT_ROOT: /opt/finsentry
    FINSENTRY_DUCKDB: /opt/finsentry/data/warehouse.duckdb
  volumes:
    - ../:/opt/finsentry                      # the whole repo (code + data + dbt)
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Finsentry --lastname Admin \
          --role Admin --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
